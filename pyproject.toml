[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "short-video-creator"
version = "1.0.0"
description = "Create captioned short videos with a background video."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
    "imageio-ffmpeg>=0.5,<0.7",
    "onnx-asr[cpu,hub]==0.12.0",
    "Pillow>=10,<12",
]

[project.scripts]
svc = "short_video_creator.cli:main"

[tool.setuptools]
packages = ["short_video_creator"]

[tool.setuptools.package-data]
short_video_creator = ["assets/fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
